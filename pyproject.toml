[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syndset"
version = "0.1.0"
description = "A diagnostic battery and synthetic testbed for neural network architectures."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Davide", email = "davide@example.com" }
]
keywords = [
  "pytorch",
  "deep-learning",
  "neural-networks",
  "diagnostics",
  "synthetic-datasets",
  "gradient-flow",
  "model-evaluation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["syndset*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E111",  # Indentation is not a multiple of 4 (we use 2 spaces)
  "E114",  # Indentation is not a multiple of 4 (comment)
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
